!
version 15.1
service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname SiteA-R1
!
!
!
enable secret 5 $1$mERr$Bok4KDfVutXOJolNq009M/
!
!
ip dhcp excluded-address 192.168.1.1 192.168.1.10
ip dhcp excluded-address 192.168.2.1 192.168.2.10
!
ip dhcp pool VLAN10
 network 192.168.1.0 255.255.255.0
 default-router 192.168.1.1
 dns-server 192.168.6.2
 domain-name yannickccna.com
ip dhcp pool VLAN20
 network 192.168.2.0 255.255.255.0
 default-router 192.168.2.1
 dns-server 192.168.6.2
 domain-name yannickccna.com
!
!
!
ip cef
no ipv6 cef
!
!
!
username yannick secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
!
license udi pid CISCO2911/K9 sn FTX15242U6X-
!
!
!
lldp run
!
!
!
!
!
!
!
!
!
ip ssh version 2
ip domain-name yannickccna.com
ip name-server 192.168.6.2
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface Loopback0
 ip address 4.4.4.4 255.255.255.255
!
interface GigabitEthernet0/0
 description #LAN Site-A#
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/0.10
 description #Downlink to VLAN 10#
 encapsulation dot1Q 10
 ip address 192.168.1.1 255.255.255.0
!
interface GigabitEthernet0/0.20
 description #Downlink to VLAN 20#
 encapsulation dot1Q 20
 ip address 192.168.2.1 255.255.255.0
!
interface GigabitEthernet0/0.99
 description #Downlink to VLAN 99#
 encapsulation dot1Q 99
 ip address 10.40.0.41 255.255.255.248
!
interface GigabitEthernet0/1
 description #Uplink to Edge-R1#
 ip address 10.10.0.6 255.255.255.252
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
router eigrp 1
 eigrp router-id 4.4.4.4
 passive-interface Loopback0
 passive-interface GigabitEthernet0/0.10
 passive-interface GigabitEthernet0/0.20
 passive-interface GigabitEthernet0/0.99
 network 10.10.0.4 0.0.0.3
 network 4.4.4.4 0.0.0.0
 network 192.168.1.0
 network 192.168.2.0
 network 10.40.0.40 0.0.0.7
!
ip classless
!
ip flow-export version 9
!
!
ip access-list standard SSH-Restriction
 permit host 10.40.0.4
 permit host 10.40.0.42
!
!
!
!
!
logging trap debugging
logging 192.168.6.2
line con 0
 exec-timeout 45 0
 logging synchronous
!
line aux 0
!
line vty 0 4
 access-class SSH-Restriction in
 logging synchronous
 login local
 transport input ssh
line vty 5 15
 access-class SSH-Restriction in
 logging synchronous
 login local
 transport input ssh
!
!
ntp server 192.168.7.2
!
end

