interface GigabitEthernet0/0
 description #Downlink to Edge-R1#
 ip address 10.10.0.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf priority 1
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 description #Downlink to Edge-R3#
 ip address 10.30.0.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf priority 1
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/2.70
 description #Downlink to SRV3#
 encapsulation dot1Q 70
 ip address 192.168.6.1 255.255.255.0
 ip access-group SRV3-Inbound out
!
interface GigabitEthernet0/2.99
 description #Management#
 encapsulation dot1Q 99
 ip address 10.40.0.65 255.255.255.248
 ip access-group SRV3-Inbound out
!
interface Serial0/3/0
 description #PRIMARY WAN Link to HQ-R2#
 ip address 10.0.0.1 255.255.255.252
 clock rate 4000000
!
interface Serial0/3/1
 description #BACKUP WAN Link to HQ-R2#
 ip address 10.0.0.5 255.255.255.252
 ip ospf cost 200
 clock rate 4000000
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 passive-interface GigabitEthernet0/2
 passive-interface Loopback0
 passive-interface GigabitEthernet0/2.70
 passive-interface GigabitEthernet0/2.99
