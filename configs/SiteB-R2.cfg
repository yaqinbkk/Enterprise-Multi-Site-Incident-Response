!
version 15.1
service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname SiteB-R2
!
!
!
enable secret 5 $1$mERr$Bok4KDfVutXOJolNq009M/
!
!
ip dhcp excluded-address 192.168.3.1 192.168.3.10
ip dhcp excluded-address 192.168.4.1 192.168.4.10
!
ip dhcp pool VLAN30
 network 192.168.3.0 255.255.255.0
 default-router 192.168.3.1
 dns-server 192.168.6.2
 domain-name yannickccna.com
ip dhcp pool VLAN40
 network 192.168.4.0 255.255.255.0
 default-router 192.168.4.1
 dns-server 192.168.6.2
 domain-name yannickccna.com
!
!
!
ip cef
no ipv6 cef
!
!
!
username yannick secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
!
license udi pid CISCO2911/K9 sn FTX152465HT-
!
!
!
lldp run
!
!
!
!
!
!
!
!
!
ip ssh version 2
ip domain-name yannickccna.com
ip name-server 192.168.6.2
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface Loopback0
 ip address 6.6.6.6 255.255.255.255
!
interface GigabitEthernet0/0
 description #LAN Site-B#
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/0.30
 description #Downlink to VLAN 30#
 encapsulation dot1Q 30
 ip address 192.168.3.1 255.255.255.0
!
interface GigabitEthernet0/0.40
 description #Downlink to VLAN 40#
 encapsulation dot1Q 40
 ip address 192.168.4.1 255.255.255.0
!
interface GigabitEthernet0/0.99
 description #Downlink to VLAN 99#
 encapsulation dot1Q 99
 ip address 10.40.0.49 255.255.255.248
!
interface GigabitEthernet0/1
 description #Internal Uplink to Edge-R2#
 ip address 10.20.0.6 255.255.255.252
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
router eigrp 2
 eigrp router-id 6.6.6.6
 passive-interface Loopback0
 passive-interface GigabitEthernet0/0.30
 passive-interface GigabitEthernet0/0.40
 passive-interface GigabitEthernet0/0.99
 network 10.20.0.4 0.0.0.3
 network 192.168.3.0
 network 192.168.4.0
 network 6.6.6.6 0.0.0.0
 network 10.40.0.48 0.0.0.7
!
ip classless
!
ip flow-export version 9
!
!
ip access-list standard SSH-Restriction
 permit host 10.40.0.4
 permit host 10.40.0.50
!
!
!
!
!
logging trap debugging
logging 192.168.6.2
line con 0
 exec-timeout 45 0
 logging synchronous
!
line aux 0
!
line vty 0 4
 access-class SSH-Restriction in
 logging synchronous
 login local
 transport input ssh
line vty 5 15
 access-class SSH-Restriction in
 logging synchronous
 login local
 transport input ssh
!
!
ntp server 192.168.7.2
!
end

