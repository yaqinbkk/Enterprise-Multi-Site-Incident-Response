!
!
!
!
!
!
interface Loopback0
 ip address 8.8.8.8 255.255.255.255
!
interface GigabitEthernet0/0
 description #LAN Site-C#
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/0.50
 description #Downlink to VLAN 50#
 encapsulation dot1Q 50
 ip address 192.168.5.1 255.255.255.0
!
interface GigabitEthernet0/0.99
 description #Downlink to VLAN 99#
 encapsulation dot1Q 99
 ip address 10.40.0.57 255.255.255.248
!
interface GigabitEthernet0/1
 description #Uplink to Edge-R3#
 ip address 10.30.0.6 255.255.255.252
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
router eigrp 3
 eigrp router-id 8.8.8.8
 passive-interface GigabitEthernet0/0
 passive-interface Loopback0
 passive-interface GigabitEthernet0/0.50
 passive-interface GigabitEthernet0/0.99
 network 8.8.8.8 0.0.0.0
 network 10.30.0.4 0.0.0.3
 network 192.168.5.0
 network 10.40.0.56 0.0.0.7
!
ip classless
!
ip flow-export version 9
!
!
ip access-list standard SSH-Restriction
 permit host 10.40.0.4
 permit host 10.40.0.58
